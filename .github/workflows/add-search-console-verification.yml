name: Add Search Console verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-search-console-verification.yml"

permissions:
  contents: write

jobs:
  add-verification-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google verification meta tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<meta name="google-site-verification" content="MlHco7fYLUif7n3JPSiI1gh4e2xzQkcpK6tDUPB565c" />'
          if tag not in s:
              anchor = '<meta name="viewport" content="width=device-width, initial-scale=1.0" />'
              if anchor not in s:
                  raise SystemExit('viewport anchor not found')
              s = s.replace(anchor, anchor + '\n  ' + tag, 1)
              p.write_text(s)
          PY
      - name: Verify tag exists
        run: grep -Fq '<meta name="google-site-verification" content="MlHco7fYLUif7n3JPSiI1gh4e2xzQkcpK6tDUPB565c" />' index.html
      - name: Commit website verification tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Verify My Wealth Square with Google Search Console"
            git push
          fi
