<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #0d3478; background: #fff2a8; font-family: system-ui, sans-serif; }
      main { max-width: 520px; padding: 36px; border: 1px solid #dccf88; background: #fffbea; }
      .mark { width: 58px; height: 58px; display: grid; grid-template-columns: 1fr 1fr; border: 4px solid #16499b; }
      .mark span:last-child { margin-top: 42%; background: #16499b; }
      h1 { margin: 26px 0 12px; font: 500 42px/1 Georgia, serif; letter-spacing: -.04em; }
      p { color: #5d6d88; line-height: 1.65; }
      button { margin-top: 12px; padding: 12px 18px; color: #fffbea; background: #16499b; border: 0; font: 750 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span></div>
      <h1>Unable to open the calculator</h1>
      <p>The calculator is included inside the app and normally works without an internet connection. Close and reopen the app. If this message continues, reinstall the app.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
